<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-label="mcl-chess components">
<title>mcl-chess components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="820"/>
<rect class="bound" x="16" y="40" width="968" height="740" rx="12"/>
<text class="t-bound" x="32" y="62">play_games [Container, CMD]</text>
<rect class="b-sys" x="32" y="70" width="456" height="110" rx="10"/>
<text class="t-code" x="48" y="98">game_aggregate, game_state, game_status.hrl</text>
<text class="t-type" x="48" y="116">[evoq_aggregate + state module]</text>
<text class="t-desc" x="48" y="140">Replays its own stream to the state: seats, position, to_move,</text>
<text class="t-desc" x="48" y="156">ply, clocks, status flags, outcome. Every guard lives in a</text>
<text class="t-desc" x="48" y="172">maybe_* handler, never in a caller.</text>
<rect class="b-cmp" x="512" y="70" width="456" height="110" rx="10"/>
<text class="t-code" x="528" y="98">mcl_chess_facts</text>
<text class="t-type" x="528" y="116">[the only module naming the mesh SDK]</text>
<text class="t-desc" x="528" y="140">Owns every topic and every translation: the facts contract in</text>
<text class="t-desc" x="528" y="156">one place, pinned by mcl_chess_facts_tests. Desks emit through</text>
<text class="t-desc" x="528" y="172">it; nothing else names a topic.</text>
<rect class="b-cmp" x="32" y="206" width="210" height="96" rx="10"/>
<text class="t-code" x="48" y="234">initiate_game/</text>
<text class="t-type" x="48" y="252">[desk: birth]</text>
<text class="t-desc" x="48" y="276">game_initiated_v1</text>
<rect class="b-cmp" x="262" y="206" width="210" height="96" rx="10"/>
<text class="t-code" x="278" y="234">claim_seat/</text>
<text class="t-type" x="278" y="252">[desk: seats]</text>
<text class="t-desc" x="278" y="276">seat_claimed_v1,</text>
<text class="t-desc" x="278" y="292">seat_refused_v1</text>
<rect class="b-cmp" x="492" y="206" width="210" height="96" rx="10"/>
<text class="t-code" x="508" y="234">start_game/</text>
<text class="t-type" x="508" y="252">[desk: start]</text>
<text class="t-desc" x="508" y="276">game_started_v1</text>
<rect class="b-later" x="712" y="206" width="210" height="96" rx="10"/>
<text class="t-code" x="728" y="234">submit_move/</text>
<text class="t-type" x="728" y="252">[desk: play, planned WP5]</text>
<text class="t-desc" x="728" y="276">move_played_v1,</text>
<text class="t-desc" x="728" y="292">move_refused_v1</text>
<rect class="b-later" x="32" y="322" width="210" height="96" rx="10"/>
<text class="t-code" x="48" y="350">resign_game/</text>
<text class="t-type" x="48" y="368">[desk: play, planned WP5]</text>
<text class="t-desc" x="48" y="392">game_ended_v1</text>
<rect class="b-cmp" x="262" y="322" width="210" height="96" rx="10"/>
<text class="t-code" x="278" y="350">withdraw_game/</text>
<text class="t-type" x="278" y="368">[desk: death]</text>
<text class="t-desc" x="278" y="392">game_archived_v1,</text>
<text class="t-desc" x="278" y="408">pre-start only</text>
<rect class="b-later" x="492" y="322" width="210" height="96" rx="10"/>
<text class="t-code" x="508" y="350">flag_clock/, end_game/</text>
<text class="t-type" x="508" y="368">[internal, planned WP6]</text>
<text class="t-desc" x="508" y="392">clock_flagged_v1,</text>
<text class="t-desc" x="508" y="408">game_ended_v1</text>
<rect class="b-later" x="712" y="322" width="210" height="96" rx="10"/>
<text class="t-code" x="728" y="350">archive_game/</text>
<text class="t-type" x="728" y="368">[desk: death, planned WP6]</text>
<text class="t-desc" x="728" y="392">game_archived_v1,</text>
<text class="t-desc" x="728" y="408">after retention</text>
<rect class="b-cmp" x="32" y="480" width="456" height="132" rx="10"/>
<text class="t-code" x="48" y="508">on_* policies</text>
<text class="t-type" x="48" y="526">[evoq_event_handler, replay_policy skip]</text>
<text class="t-desc" x="48" y="550">on_seat_claimed_v1_maybe_start_game,</text>
<text class="t-desc" x="48" y="566">planned: on_move_played_v1_maybe_end_game,</text>
<text class="t-desc" x="48" y="582">on_clock_flagged_v1_maybe_end_game,</text>
<text class="t-desc" x="48" y="598">on_game_ended_v1_maybe_archive_game.</text>
<rect class="b-later" x="512" y="480" width="456" height="132" rx="10"/>
<text class="t-code" x="528" y="508">Clock instance per game</text>
<text class="t-type" x="528" y="526">[evoq_process_manager, one per game, planned WP6]</text>
<text class="t-desc" x="528" y="550">White's clock starts at game_started_v1; the mover's</text>
<text class="t-desc" x="528" y="566">stops and the opponent's starts on move_played_v1;</text>
<text class="t-desc" x="528" y="582">both stop at game_ended_v1. The deadline arrives in</text>
<text class="t-desc" x="528" y="598">handle_info/2, the hook evoq 1.27.0 added.</text>
<rect class="b-later" x="32" y="648" width="456" height="110" rx="10"/>
<text class="t-code" x="48" y="676">mcl_chess_rules</text>
<text class="t-type" x="48" y="694">[Rust NIF, planned WP4]</text>
<text class="t-desc" x="48" y="718">validate_move(Fen, Uci), apply_move(Fen, Uci) -&gt; Fen' and the</text>
<text class="t-desc" x="48" y="734">Zobrist hash, status(Fen, Halfmove) -&gt; active | checkmate |</text>
<text class="t-desc" x="48" y="750">stalemate | insufficient_material. Legal-only generation.</text>
<rect class="b-mac" x="512" y="648" width="456" height="110" rx="10"/>
<text class="t-name" x="528" y="676">evoq 1.27.0</text>
<text class="t-type" x="528" y="694">[the only application surface]</text>
<text class="t-desc" x="528" y="718">evoq_command, evoq_event, evoq_aggregate, evoq_event_handler,</text>
<text class="t-desc" x="528" y="734">evoq_process_manager, evoq_command_router, evoq_bit_flags. The</text>
<text class="t-desc" x="528" y="750">adapter is named in sys.config only: no desk touches the store.</text>
<path class="edge" d="M137 180V206" marker-end="url(#a)"/>
<text class="t-rel" x="145" y="198">every handler guards on the state</text>
<path class="edge" d="M830 206V180" marker-end="url(#a)"/>
<text class="t-rel" x="822" y="200" text-anchor="end">emits through</text>
<path class="edge" d="M482 480V418" marker-end="url(#a)"/>
<text class="t-rel" x="474" y="452" text-anchor="end">dispatches the next</text>
<text class="t-rel" x="474" y="470" text-anchor="end">command into a desk</text>
<path class="edge" d="M597 480V418" marker-end="url(#a)"/>
<text class="t-rel" x="605" y="470">flag_clock_v1</text>
<path class="edge" d="M120 612V648" marker-end="url(#a)"/>
<text class="t-rel" x="128" y="634">asks for status</text>
<rect class="b-sys" x="24" y="792" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="804">In scope</text>
<rect class="b-mac" x="110.8" y="792" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="804">Macula infrastructure</text>
<rect class="b-ext" x="283.4" y="792" width="22" height="14" rx="3"/>
<text class="t-leg" x="313.4" y="804">External system</text>
<rect class="b-cmp" x="416.4" y="792" width="22" height="14" rx="3"/>
<text class="t-leg" x="446.4" y="804">Container or component</text>
<rect class="b-later" x="595.5999999999999" y="792" width="22" height="14" rx="3"/>
<text class="t-leg" x="625.5999999999999" y="804">Planned, not built</text>
<rect class="bound" x="748.3999999999999" y="792" width="22" height="14" rx="3"/>
<text class="t-leg" x="778.3999999999999" y="804">Boundary</text>
</svg>
