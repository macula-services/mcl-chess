<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840" role="img" aria-label="mcl-chess containers">
<title>mcl-chess containers</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1240" height="840"/>
<rect class="bound" x="24" y="40" width="700" height="660" rx="12"/>
<text class="t-bound" x="40" y="62">The mcl-chess box [mcl_om mesh service, one OCI container]</text>
<rect class="b-sys" x="44" y="76" width="656" height="140" rx="10"/>
<text class="t-name" x="60" y="104">mcl_chess (boot app)</text>
<text class="t-type" x="60" y="122">[OTP release, mcl_om_service]</text>
<text class="t-desc" x="60" y="146">Opens the event store before mcl_om:boot/1 and starts no child of its own: the departments</text>
<text class="t-desc" x="60" y="162">are application dependencies the release starts. Serves /health. initiate_game, claim_seat,</text>
<text class="t-desc" x="60" y="178">submit_move, resign_game, withdraw_game and get_game_by_id are its own procedures; mcl_om</text>
<text class="t-desc" x="60" y="194">adds open info and get_limits, and capabilities/0 is the list. Names any missing D25 grant.</text>
<rect class="b-cmp" x="44" y="240" width="208" height="152" rx="10"/>
<text class="t-name" x="60" y="268">play_games</text>
<text class="t-type" x="60" y="286">[CMD: commands]</text>
<text class="t-desc" x="60" y="310">One desk per slice, from</text>
<text class="t-desc" x="60" y="326">birth to archive; the only</text>
<text class="t-desc" x="60" y="342">writer of events. Nine</text>
<text class="t-desc" x="60" y="358">emitters publish the facts,</text>
<text class="t-desc" x="60" y="374">started by its supervisor.</text>
<rect class="b-cmp" x="264" y="240" width="208" height="136" rx="10"/>
<text class="t-name" x="280" y="268">project_games</text>
<text class="t-type" x="280" y="286">[PRJ: projections]</text>
<text class="t-desc" x="280" y="310">One projection per event,</text>
<text class="t-desc" x="280" y="326">writing the read model and</text>
<text class="t-desc" x="280" y="342">the computed status label</text>
<text class="t-desc" x="280" y="358">at projection time.</text>
<rect class="b-cmp" x="484" y="240" width="208" height="136" rx="10"/>
<text class="t-name" x="500" y="268">query_games</text>
<text class="t-type" x="500" y="286">[QRY: read model]</text>
<text class="t-desc" x="500" y="310">get_game_by_id today; by</text>
<text class="t-desc" x="500" y="326">status, page and player are</text>
<text class="t-desc" x="500" y="342">later. Reads SQLite, never</text>
<text class="t-desc" x="500" y="358">events.</text>
<rect class="b-cmp" x="44" y="416" width="208" height="136" rx="10"/>
<text class="t-name" x="60" y="444">Event store</text>
<text class="t-type" x="60" y="462">[reckon_db, volume /data]</text>
<text class="t-desc" x="60" y="486">The source of truth: one</text>
<text class="t-desc" x="60" y="502">stream per game, replayed</text>
<text class="t-desc" x="60" y="518">to rebuild the aggregate</text>
<text class="t-desc" x="60" y="534">on demand</text>
<rect class="b-cmp" x="264" y="416" width="208" height="136" rx="10"/>
<text class="t-name" x="280" y="444">Read model</text>
<text class="t-type" x="280" y="462">[SQLite through esqlite]</text>
<text class="t-desc" x="280" y="486">Board, move list, clocks,</text>
<text class="t-desc" x="280" y="502">status and label: what</text>
<text class="t-desc" x="280" y="518">queries serve and a board</text>
<text class="t-desc" x="280" y="534">viewer rebuilds from</text>
<rect class="b-cmp" x="44" y="576" width="648" height="104" rx="10"/>
<text class="t-name" x="60" y="604">Identity and realm admission</text>
<text class="t-type" x="60" y="622">[node identity key, D25 grants]</text>
<text class="t-desc" x="60" y="646">The identity key names the service to the realm; a procedure without its grant is</text>
<text class="t-desc" x="60" y="662">refused at the boundary.</text>
<rect class="b-mac" x="860" y="76" width="340" height="136" rx="10"/>
<text class="t-name" x="876" y="104">Macula mesh</text>
<text class="t-type" x="876" y="122">[Macula infrastructure]</text>
<text class="t-desc" x="876" y="146">Entry through the stations in the</text>
<text class="t-desc" x="876" y="162">environment (QUIC); its procedures are</text>
<text class="t-desc" x="876" y="178">advertised as mcl-chess/&lt;verb&gt;; its facts</text>
<text class="t-desc" x="876" y="194">travel the topics</text>
<rect class="b-mac" x="860" y="232" width="340" height="120" rx="10"/>
<text class="t-name" x="876" y="260">macula-realm</text>
<text class="t-type" x="876" y="278">[Macula infrastructure]</text>
<text class="t-desc" x="876" y="302">Org mcl-chess, the node endorsement</text>
<text class="t-desc" x="876" y="318">and a D25 grant per published</text>
<text class="t-desc" x="876" y="334">procedure</text>
<rect class="b-ext" x="860" y="372" width="340" height="120" rx="10"/>
<text class="t-name" x="876" y="400">ghcr.io</text>
<text class="t-type" x="876" y="418">[External: signed images]</text>
<text class="t-desc" x="876" y="442">The release image, by digest, signed</text>
<text class="t-desc" x="876" y="458">and attested; the reconciler refuses</text>
<text class="t-desc" x="876" y="474">an unsigned one on enforce</text>
<rect class="b-ext" x="860" y="512" width="340" height="120" rx="10"/>
<text class="t-name" x="876" y="540">macula-fleet</text>
<text class="t-type" x="876" y="558">[deploys it]</text>
<text class="t-desc" x="876" y="582">The service row: edge config env,</text>
<text class="t-desc" x="876" y="598">reconcile.manifest entry, and a digest</text>
<text class="t-desc" x="876" y="614">pin, canary first</text>
<path class="edge" d="M128 392V416" marker-end="url(#a)"/>
<text class="t-rel" x="136" y="408">appends</text>
<path class="edge" d="M368 376V416" marker-end="url(#a)"/>
<text class="t-rel" x="376" y="400">writes</text>
<path class="edge" d="M588 376V400H440V416" marker-end="url(#a)"/>
<text class="t-rel" x="540" y="394">reads</text>
<path class="edge" d="M252 480H264" marker-end="url(#a)"/>
<path class="edge" d="M700 120H860" marker-end="url(#a)"/>
<text class="t-rel" x="780" y="112" text-anchor="middle">advertises</text>
<path class="edge" d="M860 280H790V150H700" marker-end="url(#a)"/>
<text class="t-rel" x="786" y="142" text-anchor="middle">admits, grants</text>
<path class="edge" d="M860 432H820V190H700" marker-end="url(#a)"/>
<text class="t-rel" x="780" y="182" text-anchor="end">the image it runs</text>
<path class="edge" d="M1030 512V492" marker-end="url(#a)"/>
<text class="t-rel" x="1038" y="508">pins</text>
<text class="t-desc" x="40" y="740">One container, one box: the v1 horizon is a single service node hosting many concurrent games, each its own aggregate and</text>
<text class="t-desc" x="40" y="758">its own clock instance. Scaling out to several nodes is a later design, not v1; the per-game independence keeps it possible.</text>
<rect class="b-sys" x="24" y="800" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="812">In scope</text>
<rect class="b-mac" x="110.8" y="800" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="812">Macula infrastructure</text>
<rect class="b-ext" x="283.4" y="800" width="22" height="14" rx="3"/>
<text class="t-leg" x="313.4" y="812">External system</text>
<rect class="b-cmp" x="416.4" y="800" width="22" height="14" rx="3"/>
<text class="t-leg" x="446.4" y="812">Container or component</text>
<rect class="b-later" x="595.5999999999999" y="800" width="22" height="14" rx="3"/>
<text class="t-leg" x="625.5999999999999" y="812">Planned, not built</text>
<rect class="bound" x="748.3999999999999" y="800" width="22" height="14" rx="3"/>
<text class="t-leg" x="778.3999999999999" y="812">Boundary</text>
</svg>
